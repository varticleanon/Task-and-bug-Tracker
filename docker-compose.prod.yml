services:
  postgres:
    image: postgres:16-alpine
    container_name: task_bug_tracker_db
    restart: always
    environment:
      POSTGRES_DB: task_bug_tracker
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - db_user
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/db_user) -d task_bug_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: task_bug_tracker_api
    restart: always
    environment:
      APP_ENV: production
      HTTP_ADDR: ":8080"
      DATABASE_URL_FILE: /run/secrets/db_url
      UPLOAD_DIR: /var/lib/task-bug-tracker/attachments
      UPLOAD_MAX_BYTES: 5242880
      CSRF_HMAC_SECRET_FILE: /run/secrets/csrf_secret
      SUPERADMIN_EMAIL: admin@example.com
      SUPERADMIN_NAME: "System Administrator"
      SUPERADMIN_PASSWORD_FILE: /run/secrets/superadmin_password
    volumes:
      - attachments_data:/var/lib/task-bug-tracker/attachments
    secrets:
      - db_url
      - csrf_secret
      - superadmin_password
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app_network

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: task_bug_tracker_web
    restart: always
    # Port 80/443 host dipakai Traefik Dokploy. nginx non-root tetap listen 8080
    # di dalam container; konfigurasi sudah disalin oleh Dockerfile.
    expose:
      - "8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app_network
      - dokploy-network

volumes:
  postgres_data:
  attachments_data:

secrets:
  db_user:
    file: ./secrets/db_user.txt
  db_password:
    file: ./secrets/db_password.txt
  db_url:
    file: ./secrets/db_url.txt
  csrf_secret:
    file: ./secrets/csrf_secret.txt
  superadmin_password:
    file: ./secrets/superadmin_password.txt

networks:
  app_network:
    driver: bridge
  dokploy-network:
    external: true
